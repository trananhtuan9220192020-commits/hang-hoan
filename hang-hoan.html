<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho - Hàng hoàn</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #f3f6fa;
  font-family: Arial, sans-serif;
}
.container { max-width: 600px; margin: auto; }
.card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}
h1 { text-align: center; margin-top: 0; }
label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: black;
  max-height: 360px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: #2563eb;
  cursor: pointer;
}
button:disabled { background: #aaa; cursor: not-allowed; }
.result { display: flex; gap: 10px; }
.result button { flex: 1; }
.correct { background: #16a34a; }
.wrong { background: #dc2626; }
.selected { outline: 4px solid #93c5fd; }
#status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  background: #f1f5f9;
  white-space: pre-line;
  font-size: 14px;
}
.preview { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>📦 HÀNG HOÀN</h1>

 <label>Mã đơn / mã kiện</label>

<div class="order-row">
  <input id="orderCode" placeholder="DH123456" autocomplete="off">

  <button
    type="button"
    id="scanButton"
    class="scan-button"
    onclick="startScanner()"
  >
    📷 QUÉT
  </button>
</div>
<div id="scannerBox" class="scanner-box">

  <div class="scanner-title">
    📦 Quét mã đơn
  </div>

  <div id="reader"></div>

  <div class="scanner-help">
    Đưa barcode hoặc QR vào giữa khung hình
  </div>

  <button
    type="button"
    onclick="stopScanner()"
    class="close-scanner"
  >
    ✖ ĐÓNG CAMERA QUÉT
  </button>

</div>
    <label>Người xử lý</label>
    <input id="user" placeholder="Tên nhân viên" autocomplete="off">

 <label>Kết quả</label>

<div class="result" id="resultSection">
  <button id="correct" class="correct" onclick="selectResult('Đúng')">
    ✅ Đúng
  </button>

  <button id="wrong" class="wrong" onclick="selectResult('Sai')">
    ❌ Sai
  </button>
</div>

    <button id="openCamera" onclick="openCamera()">📷 MỞ CAMERA</button>

    <video id="camera" autoplay playsinline muted></video>

    <div class="preview" id="previewBox" style="display:none;">
      <video id="preview" controls playsinline></video>
    </div>

    <button id="start" onclick="startRecording()" disabled>🔴 BẮT ĐẦU QUAY</button>
    <button id="stop" onclick="stopRecording()" disabled>⏹ DỪNG QUAY</button>
    <button id="upload" onclick="uploadVideo()" disabled>☁️ HOÀN TẤT & UPLOAD</button>
    <button id="reset" onclick="resetAll()" style="background:#64748b;">🔄 LÀM MỚI</button>

    <div id="status">Chưa bắt đầu</div>
  </div>
</div>

<script>
/*
 * Thay bằng URL Apps Script của bạn sau khi deploy
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzMpGpe7s0Fy9W6Pn9ez1NQvFH2uECWKuT2wf0sOsa7LhSXYz-UPya5k-BlzPiDhDUM/exec';

let stream = null;
let recorder = null;
let chunks = [];
let videoBlob = null;
let result = null;

/* ===== QUÉT MÃ ===== */
let html5QrCode = null;
let scannerRunning = false;
let lastScannedCode = '';
let lastScanTime = 0;

// ===== ÂM THANH BÍP =====
let audioContext = null;

function prepareBeep() {
  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) return;

    if (!audioContext) {
      audioContext = new AudioCtx();
    }

    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

  } catch (error) {
    console.log('Không khởi tạo được âm thanh:', error);
  }
}

function beep() {
  try {

    if (!audioContext) {
      prepareBeep();
    }

    if (!audioContext) return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    // Cao độ tiếng bíp
    oscillator.frequency.value = 1200;

    // Âm lượng
    gain.gain.value = 0.10;

    oscillator.start();

    // Bíp khoảng 0.15 giây
    oscillator.stop(
      audioContext.currentTime + 0.15
    );

  } catch (error) {
    console.log('Không phát được tiếng bíp:', error);
  }
}

/* ===== MỞ CAMERA QUÉT ===== */
async function startScanner() {
prepareBeep();

  if (scannerRunning) return;

  // Nếu camera quay video đang mở thì tắt nó
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;

    document.getElementById('camera').srcObject = null;
    document.getElementById('start').disabled = true;
  }

  const scannerBox = document.getElementById('scannerBox');

  scannerBox.style.display = 'block';

  setStatus('📷 Đang mở camera quét mã...');

  try {

  html5QrCode = new Html5Qrcode(
  "reader",
  {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128
    ],

    useBarCodeDetectorIfSupported: true
  }
);

    scannerRunning = true;

  await html5QrCode.start(

  {
    facingMode: "environment"
  },

  {
    fps: 10,

    disableFlip: true,

    videoConstraints: {

      facingMode: {
        ideal: "environment"
      },

      width: {
        ideal: 1920
      },

      height: {
        ideal: 1080
      },

      frameRate: {
        ideal: 30,
        max: 30
      }

    }

  },

  onScanSuccess,

  onScanFailure
);

// ===== CỐ GẮNG BẬT AUTOFOCUS =====
try {

  const capabilities =
    html5QrCode.getRunningTrackCapabilities();

  if (
    capabilities.focusMode &&
    capabilities.focusMode.includes("continuous")
  ) {

    await html5QrCode.applyVideoConstraints({

      advanced: [
        {
          focusMode: "continuous"
        }
      ]

    });

  }

} catch (error) {

  console.log(
    "Thiết bị không hỗ trợ chỉnh autofocus:",
    error
  );

}

    setStatus(
      '📷 Camera quét đã mở\n' +
      'Đưa barcode hoặc QR vào giữa khung'
    );

  } catch (error) {

    console.error(error);

    scannerRunning = false;

    scannerBox.style.display = 'none';

    setStatus(
      '❌ Không mở được camera quét mã\n' +
      error
    );
  }
}


/* ===== KHI QUÉT THÀNH CÔNG ===== */
async function onScanSuccess(decodedText, decodedResult) {

  const code = decodedText.trim();

  if (!code) return;

  const now = Date.now();

  // Chống đọc cùng một mã nhiều lần liên tục
  if (
    code === lastScannedCode &&
    now - lastScanTime < 2000
  ) {
    return;
  }

  lastScannedCode = code;
  lastScanTime = now;

  const orderInput =
    document.getElementById('orderCode');


  // ==============================
  // 1. ĐIỀN MÃ ĐƠN
  // ==============================

  orderInput.value = code;


  // ==============================
  // 2. HIỆU ỨNG Ô MÃ ĐƠN
  // ==============================

  orderInput.classList.add(
    'scan-success'
  );

  setTimeout(() => {

    orderInput.classList.remove(
      'scan-success'
    );

  }, 2000);


  // ==============================
  // 3. PHÁT TIẾNG BÍP
  // ==============================

  beep();


  // ==============================
  // 4. RUNG ĐIỆN THOẠI
  // ==============================

  if (navigator.vibrate) {
    navigator.vibrate(120);
  }


  // ==============================
  // 5. THÔNG BÁO
  // ==============================

  setStatus(
    '✅ ĐÃ QUÉT THÀNH CÔNG\n\n' +
    'Mã đơn: ' + code +
    '\n\n👉 Vui lòng chọn Đúng hoặc Sai'
  );


  // ==============================
  // 6. TỰ ĐÓNG SCANNER
  // ==============================

  await stopScanner();


  // ==============================
  // 7. TỰ CUỘN XUỐNG ĐÚNG / SAI
  // ==============================

  setTimeout(() => {

    const resultSection =
      document.getElementById(
        'resultSection'
      );

    if (resultSection) {

      resultSection.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });

    }

  }, 200);


  // ==============================
  // 8. FOCUS VÀO NÚT ĐÚNG
  // ==============================

  setTimeout(() => {

    document
      .getElementById('correct')
      .focus();

  }, 500);
}

/* ===== KHI CAMERA CHƯA ĐỌC ĐƯỢC MÃ ===== */
function onScanFailure(error) {
  // Không làm gì
}


/* ===== ĐÓNG CAMERA QUÉT ===== */
async function stopScanner() {

  if (!html5QrCode) {

    scannerRunning = false;

    document.getElementById(
      'scannerBox'
    ).style.display = 'none';

    return;
  }

  try {

    if (scannerRunning) {
      await html5QrCode.stop();
    }

  } catch (error) {
    console.log(error);
  }

  try {
    html5QrCode.clear();
  } catch (error) {
    console.log(error);
  }

  html5QrCode = null;
  scannerRunning = false;

  document.getElementById(
    'scannerBox'
  ).style.display = 'none';
}

function selectResult(value) {
  result = value;
  document.getElementById('correct').classList.remove('selected');
  document.getElementById('wrong').classList.remove('selected');
  if (value === 'Đúng') {
    document.getElementById('correct').classList.add('selected');
  } else {
    document.getElementById('wrong').classList.add('selected');
  }
  setStatus('Đã chọn: ' + value);
}

async function openCamera() {
  try {
    setStatus('⏳ Đang mở camera...');
    // Ưu tiên camera sau (environment)
    stream = await navigator.mediaDevices.getUserMedia({ 
  video: { 
    facingMode: { ideal: 'environment' }, 
    width: { ideal: 854 }, 
    height: { ideal: 480 },
    frameRate: { ideal: 24, max: 30 }
  }, 
  audio: false 
});
    const camera = document.getElementById('camera');
    camera.srcObject = stream;
    camera.style.display = 'block';
    document.getElementById('previewBox').style.display = 'none';
    document.getElementById('start').disabled = false;
    setStatus('✅ Camera đã mở – sẵn sàng quay');
  } catch (error) {
    setStatus('❌ Không mở được camera\n' + error.name + ': ' + error.message);
  }
}

function startRecording() {
  if (!stream) {
    alert('Chưa mở camera');
    return;
  }
  chunks = [];
  let options = {};
  if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
    options.mimeType = 'video/webm;codecs=vp8';
  } else if (MediaRecorder.isTypeSupported('video/webm')) {
    options.mimeType = 'video/webm';
  }
options.videoBitsPerSecond = 1500000;
  recorder = new MediaRecorder(stream, options);

  recorder.ondataavailable = function(e) {
    if (e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = function() {
    videoBlob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    // Hiện preview
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(videoBlob);
    document.getElementById('previewBox').style.display = 'block';
    document.getElementById('camera').style.display = 'none';
    document.getElementById('upload').disabled = false;
    setStatus('✅ Đã quay xong – kiểm tra video rồi bấm Upload');
  };

  recorder.start(1000); // timeslice để an toàn hơn trên mobile
  document.getElementById('start').disabled = true;
  document.getElementById('stop').disabled = false;
  setStatus('🔴 ĐANG QUAY...');
}

function stopRecording() {
  if (!recorder || recorder.state === 'inactive') return;
  recorder.stop();
  document.getElementById('stop').disabled = true;
}

async function uploadVideo() {
  const orderCode = document.getElementById('orderCode').value.trim();
  const user = document.getElementById('user').value.trim();

  if (!orderCode) { alert('Vui lòng nhập mã đơn'); return; }
  if (!user) { alert('Vui lòng nhập người xử lý'); return; }
  if (!result) { alert('Vui lòng chọn Đúng hoặc Sai'); return; }
  if (!videoBlob) { alert('Chưa có video'); return; }

const uploadButton = document.getElementById('upload');

uploadButton.disabled = true;
uploadButton.innerText = '⏳ ĐANG UPLOAD...';

  setStatus('⏳ Đang chuyển đổi & upload...\nCó thể mất vài chục giây tùy độ dài video');

  const base64 = await blobToBase64(videoBlob);
  const now = new Date();
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();
  const fileName = `${day}-${month}-${year}_${orderCode}_${result}_${user}.webm`;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        orderCode,
        user,
        result,
        fileName,
        mimeType: videoBlob.type || 'video/webm',
        base64
      })
    });

    const data = await response.json();

    if (!data.success) throw new Error(data.error || 'Lỗi không xác định');

    setStatus(
      '✅ HOÀN TẤT\n\n' +
      'File: ' + data.fileName + '\n' +
      (data.fileUrl ? 'Link: ' + data.fileUrl : '')
    );

    // Reset sau khi thành công
    setStatus(
  '✅ HOÀN TẤT\n\n' +
  'Mã đơn: ' + orderCode +
  '\nĐã upload thành công' +
  '\n\n⏳ Chuẩn bị đơn tiếp theo...'
);

setTimeout(() => {
  nextOrder();
}, 1500);
  } catch (error) {

  setStatus(
    '❌ Upload thất bại\n' +
    error.message
  );

  uploadButton.disabled = false;
  uploadButton.innerText = '☁️ HOÀN TẤT & UPLOAD';
}
}

function nextOrder() {

  // ==========================
  // DỪNG CAMERA
  // ==========================

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }

  document.getElementById(
    'camera'
  ).srcObject = null;


  // ==========================
  // XÓA VIDEO CŨ
  // ==========================

  videoBlob = null;
  chunks = [];

  const preview =
    document.getElementById('preview');

  preview.pause();

  preview.removeAttribute('src');

  preview.load();

  document.getElementById(
    'previewBox'
  ).style.display = 'none';


  // ==========================
  // XÓA MÃ ĐƠN
  // ==========================

  document.getElementById(
    'orderCode'
  ).value = '';


  // ==========================
  // RESET ĐÚNG / SAI
  // ==========================

  result = null;

  document
    .getElementById('correct')
    .classList.remove('selected');

  document
    .getElementById('wrong')
    .classList.remove('selected');


  // ==========================
  // RESET NÚT
  // ==========================

  document.getElementById(
    'start'
  ).disabled = true;

  document.getElementById(
    'stop'
  ).disabled = true;

  const uploadButton =
    document.getElementById('upload');

  uploadButton.disabled = true;

  uploadButton.innerText =
    '☁️ HOÀN TẤT & UPLOAD';


  // ==========================
  // CAMERA CHÍNH
  // ==========================

  document.getElementById(
    'camera'
  ).style.display = 'block';


  // ==========================
  // GIỮ NGUYÊN TÊN NHÂN VIÊN
  // ==========================

  // Không xóa document.getElementById('user')


  // ==========================
  // RESET SCANNER
  // ==========================

  lastScannedCode = '';
  lastScanTime = 0;


  // ==========================
  // TRẠNG THÁI
  // ==========================

  setStatus(
    '📦 SẴN SÀNG CHO ĐƠN TIẾP THEO\n' +
    'Quét hoặc nhập mã đơn mới'
  );


  // ==========================
  // ĐƯA CON TRỎ VỀ MÃ ĐƠN
  // ==========================

  document
    .getElementById('orderCode')
    .focus();
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function setStatus(text) {
  document.getElementById('status').innerText = text;
}

function resetAll() {
  // Dừng camera nếu đang mở
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  document.getElementById('camera').srcObject = null;
  document.getElementById('camera').style.display = 'block';
  document.getElementById('previewBox').style.display = 'none';
  document.getElementById('preview').src = '';
  videoBlob = null;
  result = null;
  document.getElementById('correct').classList.remove('selected');
  document.getElementById('wrong').classList.remove('selected');
  document.getElementById('start').disabled = true;
  document.getElementById('stop').disabled = true;
  document.getElementById('upload').disabled = true;
  setStatus('Đã làm mới – sẵn sàng cho đơn tiếp theo');
}
</script>
</body>
</html>
